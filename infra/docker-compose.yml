services:
  db:
    image: postgres:16
    container_name: enp-db
    environment:
      POSTGRES_USER: enp
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: enp_evaluation
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dbdata: